/* CASE 08 — 유리온실의 23분
   서로 다른 단서가 연결되어야 풀리도록 구성한 사건.
*/
const evidence={
 A:[
  ["a01","현장사진 — 유리온실 동쪽 테이블","23:52 발견 당시 피해자는 테이블 옆 바닥에 쓰러져 있었다. 반쯤 마신 차, 찻숟가락, 황동 회중시계가 남아 있다."],
  ["a02","부검 예비보고서","사망 원인은 심장성 독성 반응. 독성물질은 소량 섭취 후 약 5~10분의 지연을 거쳐 급격한 증상을 일으킬 수 있다."],
  ["a03","차잔 감식","차액 자체에서는 독성물질이 검출되지 않았다. 잔 손잡이 안쪽에서만 미량의 동일 물질이 확인됐다."],
  ["a04","회중시계 물증","회중시계 초침은 23:34에서 멈췄지만 정비 기록상 이 시계는 실제보다 11분 느리다. 따라서 시계가 멈춘 실제 시각은 23:45다."],
  ["a05","문 잠금장치 감식","온실 자동문은 외부에서도 비상키로 열 수 있다. 외부 비상키홀에 최근 금속 마찰 흔적이 있다."],
  ["a06","찻숟가락 미세물질","숟가락 홈에서 투명 수지 조각과 독성물질 잔류물이 함께 발견됐다. 수지는 피해자의 찻숟가락에 붙어 있던 장식용 손잡이의 일부와 성분이 일치한다."]
 ],
 B:[
  ["b01","비서 한서윤 진술","23:10경 피해자가 '원본 계약서를 찾았다'고 말했다. 23:20경에는 온실에 사람이 없는 것을 봤다고 주장한다."],
  ["b02","김도현 진술","22:50부터 음악실에서 피아노를 연습했고 23:30에야 소란을 듣고 나왔다고 주장한다."],
  ["b03","오세진 진술","22:56에 저택을 떠났고 이후 다시 들어오지 않았다고 주장한다."],
  ["b04","민아린 진술","23:15에 차를 준비했지만 피해자에게 직접 가져다주지는 않았다고 주장한다."],
  ["b05","삭제 복구 문자","23:18 발신: '열쇠는 그대로 두세요. 계약서만 바꾸면 됩니다.' 수신자는 한서윤의 번호가 아니다. 발신자는 특정되지 않았다."],
  ["b06","방문기록 사본","22:40 오세진 입장, 22:56 현관 퇴장. 23:07 후문 센서가 14초간 작동했다. 후문 기록은 사람의 신원을 식별하지 않는다."],
  ["b07","계약서 초안","피해자는 다음 날 오전 위조 계약서의 진위를 공개할 예정이었다. 수정본에는 김도현에게 불리한 조항이 추가돼 있다."]
 ],
 C:[
  ["c01","현관 CCTV","22:56 오세진이 현관으로 나간다. 화면의 유리 반사에는 다른 사람의 그림자가 보이지만 얼굴은 식별되지 않는다."],
  ["c02","후문 CCTV","23:06:48 후문 접근, 23:07:02 문 열림, 23:07:16 문 닫힘. 인물은 우산 때문에 얼굴 식별이 불가능하다."],
  ["c03","온실 카메라 장애 로그","23:11:02~23:14:41 온실 카메라 1대만 저장 실패. 다른 카메라는 정상 작동했다."],
  ["c04","스마트홈 전력 로그","23:19:12 온실 조명이 100%에서 20%로 낮아지고 23:21:04 다시 100%로 복귀했다. 전원 자체의 정전은 없었다."],
  ["c05","온실 자동문 로그","23:07:03 외부 개방, 23:07:17 폐쇄. 23:27:51 내부 개방, 23:28:06 폐쇄. 23:41:22 경찰 도착 후 개방."],
  ["c06","벽시계 보정 기록","온실 벽시계는 실제보다 12분 빠르다. 마지막 보정은 사건 3일 전."],
  ["c07","피해자 휴대폰 동기화 기록","23:24:09 메모 앱 수정: '계약서 원본은 온실 화분 아래.' 23:29:02 삭제. 자동 동기화 서버에는 수정·삭제 시각이 그대로 남아 있다."]
 ];
};

const combinations=[
 {id:"combo1",need:["a02","a03"],title:"조합 단서 ① — 독은 차가 아니었다",text:"차 자체에서 치명량이 검출되지 않았고 손잡이 안쪽에만 미량이 남아 있다. 독성물질은 차가 아니라 마시는 과정의 도구를 통해 섭취됐을 가능성이 높다."},
 {id:"combo2",need:["a06","b04"],title:"조합 단서 ② — 차 도구의 흔적",text:"23:15에 차가 준비됐고 찻숟가락에는 독성물질과 특정 수지 잔류물이 함께 남았다. 누군가 차를 준비한 뒤 숟가락을 손댔을 가능성을 조사해야 한다."},
 {id:"combo3",need:["b02","c04"],title:"조합 단서 ③ — 음악실 알리바이",text:"김도현은 22:50부터 음악실에 있었다고 주장하지만, 23:19~23:21 온실 조명 변화와 다른 이동 기록을 함께 대조할 필요가 있다. 전력 로그만으로 음악실 체류를 증명할 수는 없다."},
 {id:"combo4",need:["b06","c02"],title:"조합 단서 ④ — 후문 방문",text:"후문이 23:07에 열렸다는 사실은 확인되지만 두 기록 모두 방문자의 신원을 증명하지 못한다. 이 기록만으로 범인을 특정해서는 안 된다."},
 {id:"combo5",need:["b07","b05"],title:"조합 단서 ⑤ — 계약서의 동기",text:"피해자는 다음 날 위조 계약서를 공개하려 했고, 누군가는 23:18에 계약서 변경을 지시했다. 계약 조작을 막거나 숨길 동기를 가진 사람을 다시 대조해야 한다."},
 {id:"combo6",need:["a05","c05","c07"],title:"조합 단서 ⑥ — 23분의 핵심",text:"자동문은 23:27:51에 내부에서 열렸고, 피해자 휴대폰은 23:24:09에 원본 계약서 위치를 기록했다. 시계와 문 기록을 혼동하지 말고 실제 시각을 기준으로 재구성해야 한다."}
];

/* 중요: 기존 코드의 공용 공유 버그 수정.
   Object.fromEntries(evidence.A)는 [id,title,desc]를 잘못 처리하므로
   여기서는 각 배열을 객체로 명시적으로 변환한다.
*/
const catalog={};
Object.values(evidence).flat().forEach(([id,title,text])=>catalog[id]={id,title,text});

const solution={
 culprit:"김도현",
 method:"독성물질이 묻은 찻숟가락을 이용해 차를 마시는 과정에서 섭취시키는 방식",
 realTime:"23:27~23:28",
 motive:"위조 계약서 공개를 막고 계약 조작 사실을 숨기기 위해",
 alibi:"음악실에 계속 있었다는 진술은 온실 관련 시간대의 다른 기록과 함께 검증해야 하며, 스스로 제시한 알리바이만으로는 성립하지 않는다."
};

let app,auth,db,uid=null,roomCode="",role="",playerName="",room=null,tab="home",unsubs=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const makeCode=()=>Math.random().toString(36).slice(2,7).toUpperCase();
const clearSubs=()=>{unsubs.forEach(f=>f&&f());unsubs=[]};
const roomRef=()=>ref(db,"rooms/"+roomCode);

function render(){
 if(!uid){$("#app").innerHTML='<div class="wrap"><div class="card">Firebase 연결 중…</div></div>';return}
 if(!room){renderLobby();return}
 renderGame();
}

function renderLobby(){
 $("#app").innerHTML=`<div class="wrap">
 <div class="hero"><div class="eyebrow">CASE 08 · ONLINE CO-OP</div><div class="title">유리온실의 23분</div><div class="sub">3명의 탐정이 서로 다른 증거를 모아 하나의 사건을 재구성합니다.</div></div>
 <div class="card"><h2>방 만들기</h2><input id="newName" placeholder="탐정 이름"><button class="primary" id="create">새 사건방 만들기</button></div>
 <div class="card"><h2>방 참가</h2><input id="joinCode" placeholder="방 코드 5자리" maxlength="5"><input id="joinName" placeholder="탐정 이름"><button class="primary" id="join">사건방 참가</button></div>
 <div class="card"><div class="notice">이번 사건은 용의자들의 진술, CCTV 시간, 시계 오차, 물증을 서로 대조해야 풀 수 있습니다.</div></div>
 </div>`;
 $("#create").onclick=createRoom;$("#join").onclick=joinRoom;
}

async function createRoom(){
 playerName=$("#newName").value.trim()||"탐정";
 roomCode=makeCode();
 await set(roomRef(),{createdAt:Date.now(),caseId:"CASE08",state:"lobby",players:{},shared:{},chat:{},notes:{},finals:{}});
 renderRolePicker();
}

async function joinRoom(){
 roomCode=$("#joinCode").value.trim().toUpperCase();
 playerName=$("#joinName").value.trim()||"탐정";
 if(roomCode.length!==5)return alert("5자리 방 코드를 입력하세요.");
 const s=await get(roomRef());
 if(!s.exists())return alert("존재하지 않는 방입니다.");
 renderRolePicker();
}

function renderRolePicker(){
 $("#app").innerHTML=`<div class="wrap">
 <div class="hero"><div class="eyebrow">ROLE SELECTION · ${esc(roomCode)}</div><div class="title">탐정 역할 선택</div><div class="sub">한 역할은 한 명만 선택할 수 있습니다.</div></div>
 <div class="grid">${Object.entries(roles).map(([k,v])=>`<div class="role"><span class="pill">DETECTIVE ${k}</span><h3>${esc(v.name)}</h3><p>${esc(v.desc)}</p><button data-role="${k}">이 역할로 참가</button></div>`).join("")}</div>
 </div>`;
 document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>claimRole(b.dataset.role,playerName));
}

async function claimRole(r,n){
 const slot=ref(db,`rooms/${roomCode}/players/${r}`);
 let ok=false;
 await runTransaction(slot,cur=>{
   if(cur && cur.uid && cur.uid!==uid)return cur;
   ok=true;
   return {uid,name:n,joinedAt:Date.now()};
 });
 if(!ok)return alert("이미 다른 플레이어가 선택한 역할입니다.");
 role=r; playerName=n;
 localStorage.setItem("case08",JSON.stringify({roomCode,role,name:n}));
 listenRoom();
}

function listenRoom(){
 clearSubs();
 unsubs.push(onValue(roomRef(),s=>{room=s.val();render()}));
}

function renderGame(){
 const ps=room.players||{};
 $("#app").innerHTML=`<div class="wrap">
 <div class="top"><div><div class="eyebrow">CASE 08 · ${esc(roomCode)}</div><h1>유리온실의 23분</h1></div><span class="pill">${esc(roles[role]?.name||role)}</span></div>
 <div class="card"><div class="top"><div><b>방 ${esc(roomCode)}</b><div class="status">실시간 협동 사건방</div></div><div class="status">${["A","B","C"].map(k=>ps[k]?`● ${k} ${esc(ps[k].name)}`:`○ ${k} 대기`).join("　")}</div></div></div>
 <div class="tabs">${[["home","사건"],["private","내 증거"],["shared","공용 사건판"],["combine","증거 조합"],["chat","탐정 채널"],["notes","추리노트"],["final","최종 추리"]].map(x=>`<button class="${tab===x[0]?'active':''}" data-tab="${x[0]}">${x[1]}</button>`).join("")}</div>
 <div id="content"></div></div>`;
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderGame()});
 const c=$("#content");
 if(tab==="home")home(c);
 if(tab==="private")privateView(c);
 if(tab==="shared")sharedView(c);
 if(tab==="combine")combineView(c);
 if(tab==="chat")chatView(c);
 if(tab==="notes")notesView(c);
 if(tab==="final")finalView(c);
}

function home(c){
 c.innerHTML=`<div class="card"><h2>사건 브리핑</h2>
 <p>23:52, 저택의 유리온실에서 유명 골동품 거래상 <b>윤태준</b>이 쓰러진 채 발견됐다. 사망 직전 그는 다음 날 공개할 계약서 원본을 숨겼다는 메모를 남겼다.</p>
 <div class="notice">이 사건의 핵심은 <b>23:07~23:28</b> 사이의 움직임과 서로 다른 시계의 오차입니다. 한 사람의 진술만 믿지 마세요.</div>
 </div>
 <div class="card"><h2>용의자</h2>
 <div class="evidence"><div><b>김도현</b><small>피해자의 사업 파트너. 계약 조작 의혹을 부인.</small></div><span class="clueTag">사업</span></div>
 <div class="evidence"><div><b>한서윤</b><small>피해자의 비서. 계약서 관리 권한을 갖고 있었다.</small></div><span class="clueTag">비서</span></div>
 <div class="evidence"><div><b>오세진</b><small>골동품 시계 수리공. 22:56 퇴장 기록이 있다.</small></div><span class="clueTag">외부인</span></div>
 <div class="evidence"><div><b>민아린</b><small>주방 담당. 23:15경 차를 준비했다고 진술.</small></div><span class="clueTag">주방</span></div>
 </div>
 <div class="card"><h2>공용 타임라인의 출발점</h2><div class="timeline">
 <div><b>22:40</b> 오세진 저택 입장</div>
 <div><b>22:56</b> 오세진 현관 CCTV 퇴장</div>
 <div><b>23:07</b> 후문 센서 작동</div>
 <div><b>23:11~23:14</b> 온실 카메라 기록 공백</div>
 <div><b>23:19</b> 온실 조명 밝기 변화</div>
 <div><b>23:27~23:28</b> 자동문 내부 개방 — 결정적 사건 시간대</div>
 <div><b>23:52</b> 발견</div>
 </div></div>`;
}

function privateView(c){
 const list=evidence[role]||[];
 c.innerHTML=`<div class="card"><h2>🔒 ${esc(roles[role].name)} 개인 사건파일</h2>
 <p class="status">여기에만 네 역할의 증거가 표시됩니다. 팀에 알려줄 증거는 반드시 공유 버튼을 눌러주세요.</p>
 ${list.map(([id,t,d])=>`<div class="evidence"><div><b>${esc(t)}</b><small>${esc(d)}</small><div class="mini">${id}</div></div><button class="share" data-share="${id}">팀에게 공유</button></div>`).join("")}</div>`;
 document.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>shareEvidence(b.dataset.share));
}

async function shareEvidence(id){
 const item=catalog[id];
 if(!item)return alert("증거를 찾지 못했습니다.");
 const data={id:item.id,title:item.title,text:item.text,from:role,fromName:room.players?.[role]?.name||playerName,sharedAt:Date.now()};
 /* 핵심 수정: title/text가 정확히 저장되고, push로 고유 키를 만들어 여러 사람이 공유해도 모두 남는다. */
 await push(ref(db,`rooms/${roomCode}/shared`),data);
 alert("공용 사건판에 공유했습니다.");
 tab="shared"; renderGame();
}

function sharedView(c){
 const arr=Object.values(room.shared||{}).sort((a,b)=>(a.sharedAt||0)-(b.sharedAt||0));
 c.innerHTML=`<div class="card"><h2>📌 공용 사건판</h2>
 <p class="status">팀원이 공유한 모든 증거가 실시간으로 쌓입니다. 새로고침해도 사라지지 않습니다.</p>
 ${arr.length?`<div class="board">${arr.map(x=>`<div class="pin"><div class="from">탐정 ${esc(x.from||"?")} · ${esc(x.fromName||"탐정")}가 공유</div><b>${esc(x.title)}</b><p>${esc(x.text)}</p><span class="pill">${esc(x.id||"SHARED")}</span></div>`).join("")}</div>`:'<div class="notice">아직 공유된 증거가 없습니다. 개인 사건파일에서 증거를 공유해보세요.</div>'}
 </div>`;
}

function combineView(c){
 const ids=new Set(Object.values(room.shared||{}).map(x=>x.id));
 const unlocked=combinations.filter(x=>x.need.every(id=>ids.has(id)));
 c.innerHTML=`<div class="card"><h2>🧩 증거 조합</h2><p class="status">공용 사건판에 필요한 증거가 모두 모이면 새로운 단서가 해금됩니다. 조합 단서만으로 범인을 단정하지 마세요.</p>
 ${unlocked.length?unlocked.map(x=>`<div class="pin"><div class="from">${x.need.join(" + ")}</div><b>${esc(x.title)}</b><p>${esc(x.text)}</p></div>`).join(""):'<div class="notice">아직 해금된 조합 단서가 없습니다. 서로 다른 탐정의 증거를 공용 사건판에 공유하세요.</div>'}
 <div class="card" style="margin-top:14px"><h3>해금 진행</h3>${combinations.map(x=>`<div class="evidence"><div><b>${esc(x.title)}</b><small>${x.need.filter(id=>ids.has(id)).length}/${x.need.length} 증거 확보</small></div><span class="pill">${x.need.join(" + ")}</span></div>`).join("")}</div>
 </div>`;
}

function chatView(c){
 const chat=room.chat||{};
 c.innerHTML=`<div class="card"><h2>💬 탐정 채널</h2><div id="chat" class="chat">${Object.values(chat).sort((a,b)=>a.at-b.at).map(m=>`<div class="msg"><b>${esc(m.name)}</b> <span class="mini">(${esc(m.role)})</span> ${esc(m.text)}</div>`).join("")}</div>
 <div class="row"><input id="chatInput" placeholder="팀에게 메시지…"><button class="primary" id="send">전송</button></div></div>`;
 $("#send").onclick=async()=>{const t=$("#chatInput").value.trim();if(!t)return;await push(ref(db,`rooms/${roomCode}/chat`),{name:playerName,role,text:t,at:Date.now()});$("#chatInput").value=""};
}

function notesView(c){
 const n=room.notes?.[uid]||"";
 c.innerHTML=`<div class="card"><h2>📝 내 추리노트</h2><p class="status">이 노트는 네 계정에만 연결됩니다.</p><textarea id="note">${esc(n)}</textarea><button class="primary" id="saveNote">저장</button></div>`;
 $("#saveNote").onclick=async()=>{await set(ref(db,`rooms/${roomCode}/notes/${uid}`),$("#note").value);alert("저장했습니다.")};
}

function finalView(c){
 const finals=room.finals||{};
 const mine=finals[role];
 const allSubmitted=["A","B","C"].every(k=>finals[k]);
 const allCorrect=allSubmitted && ["A","B","C"].every(k=>scoreFinal(finals[k])===4);
 c.innerHTML=`<div class="card"><h2>⚖️ 최종 추리</h2>
 <p>정답은 미리 공개되지 않습니다. 한 번 틀려도 범인이나 세부 정답은 공개하지 않고, 증거 조합을 다시 조사한 뒤 재제출할 수 있습니다.</p>
 ${allCorrect?`<div class="notice ok"><h3>🔎 CASE 08 COMPLETE</h3><p>세 탐정의 추리가 모두 사건의 논리와 일치했습니다.</p>
 <p><b>범인:</b> ${solution.culprit}</p><p><b>수법:</b> ${solution.method}</p><p><b>실제 시각:</b> ${solution.realTime}</p><p><b>동기:</b> ${solution.motive}</p><p><b>알리바이:</b> ${solution.alibi}</p></div>`:
 `${mine?`<div class="notice ${allSubmitted?'danger':''}">${allSubmitted?'❌ 세 사람의 추리를 대조했지만 사건이 아직 완전히 풀리지 않았습니다. 정답은 공개되지 않습니다.':'제출 완료. 다른 탐정의 답이 제출될 때까지 기다려주세요.'}<br><b>재수사</b> 탭에서 공용 증거와 조합 단서를 다시 확인한 뒤, 아래에서 다시 제출할 수 있습니다.</div>`:''}
 <label>범인</label><select id="culprit"><option value="" selected disabled>범인을 선택하세요</option><option>김도현</option><option>한서윤</option><option>오세진</option><option>민아린</option></select>
 <label>수법</label><select id="method"><option value="" selected disabled>수법을 선택하세요</option><option value="spoon">독성물질이 묻은 찻숟가락을 이용해 차를 마시는 과정에서 섭취시키기</option><option value="tea">차 자체에 독을 타서 섭취시키기</option><option value="direct">직접 독성물질을 강제로 섭취시키기</option><option value="other">기타</option></select>
 <label>실제 결정적 시각</label><select id="time"><option value="" selected disabled>시각을 선택하세요</option><option value="23:11~23:14">23:11~23:14</option><option value="23:18~23:21">23:18~23:21</option><option value="23:24~23:26">23:24~23:26</option><option value="23:27~23:28">23:27~23:28</option><option value="23:41 이후">23:41 이후</option></select>
 <label>동기</label><select id="motive"><option value="" selected disabled>동기를 선택하세요</option><option value="contract">위조 계약서 공개를 막고 계약 조작을 숨기기 위해</option><option value="money">돈을 훔치기 위해</option><option value="revenge">개인적인 복수를 위해</option><option value="secret">다른 비밀을 숨기기 위해</option></select>
 <button class="primary" id="submitFinal">${mine?'재수사 후 다시 제출':'최종 추리 제출'}</button></div>
 <div class="card"><h3>제출 현황</h3>${["A","B","C"].map(k=>`<div class="evidence"><b>${roles[k].name}</b><span>${finals[k]?'제출 완료':'미제출'}</span></div>`).join("")}</div>`;
 if(allCorrect)return;
 $("#submitFinal").onclick=async()=>{
   const answer={name:playerName,culprit:$("#culprit").value,method:$("#method").value,time:$("#time").value,motive:$("#motive").value,at:Date.now()};
   if(!answer.culprit||!answer.method||!answer.time||!answer.motive)return alert("네 가지 항목을 모두 선택하세요.");
   await set(ref(db,`rooms/${roomCode}/finals/${role}`),answer);
   alert("추리를 제출했습니다. 결과는 정답을 공개하지 않고 판정됩니다.");
 };
}

function scoreFinal(f){
 if(!f)return 0;
 return (f.culprit===solution.culprit?1:0)+(f.method==="spoon"?1:0)+(f.time==="23:27~23:28"?1:0)+(f.motive==="contract"?1:0);
}

async function boot(){
 try{
   app=initializeApp(firebaseConfig);
   auth=getAuth(app);
   db=getDatabase(app);
   onAuthStateChanged(auth,u=>{uid=u?.uid||null;render()});
   await signInAnonymously(auth);
 }catch(e){
   $("#app").innerHTML=`<div class="wrap"><div class="card"><h2>Firebase 설정을 확인해주세요</h2><p>상단의 firebaseConfig에 현재 Firebase 웹 앱 설정값을 넣어야 합니다.</p><pre style="white-space:pre-wrap;color:#f2c9c9">${esc(e.message)}</pre></div></div>`;
 }
}
boot();
</script></body></html>
