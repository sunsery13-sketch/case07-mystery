<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CASE 07 — 검은 시계의 밤</title>
<style>
:root{--bg:#0b0e12;--panel:#141922;--panel2:#1b222d;--line:#303a48;--text:#eef2f6;--muted:#9ba7b6;--accent:#d8a24a;--danger:#cf6679;--ok:#69c18c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#202733 0,#0b0e12 55%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1050px;margin:auto;padding:18px}.hero{padding:24px 0 12px}.eyebrow{color:var(--accent);letter-spacing:.18em;font-size:12px}.title{font-family:Georgia,serif;font-size:clamp(34px,7vw,68px);margin:8px 0}.sub{color:var(--muted)}
.card{background:rgba(20,25,34,.92);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 12px 30px #0005}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.role{padding:18px;border:1px solid var(--line);border-radius:14px;background:#10151d}.role h3{margin:0 0 7px}.role p{color:var(--muted);min-height:55px}.role button,.primary{width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#17130b;font-weight:800}
input,textarea,select{width:100%;background:#0e131a;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;margin:6px 0 10px}textarea{min-height:100px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none!important}.pill{display:inline-block;border:1px solid var(--line);padding:5px 9px;border-radius:99px;color:var(--muted);font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.tabs{display:flex;gap:7px;overflow:auto;padding:8px 0}.tabs button{white-space:nowrap;background:#111720;color:#ccd4de;border:1px solid var(--line);border-radius:9px;padding:9px 12px}.tabs button.active{background:#2a3442;color:#fff}.evidence{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:13px;margin:8px 0;background:#111720}.evidence small{color:var(--muted)}.share{background:#273d31;color:#b8f0ca;border:1px solid #3c624b;border-radius:8px;padding:8px 10px}.locked{opacity:.45}.chat{max-height:360px;overflow:auto;background:#0c1117;border:1px solid var(--line);border-radius:12px;padding:10px}.msg{padding:8px 10px;border-bottom:1px solid #202732}.msg b{color:var(--accent)}.notice{padding:11px;border-left:3px solid var(--accent);background:#17130d;color:#e9d6ad}.danger{border-left-color:var(--danger)}.ok{border-left-color:var(--ok)}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.board .pin{background:#171d26;border:1px solid #465264;border-radius:10px;padding:12px}.status{font-size:13px;color:var(--muted)}.bigcode{font-size:30px;letter-spacing:.25em;font-weight:900;text-align:center;padding:16px;background:#0c1117;border-radius:12px}.footer{color:#697586;font-size:12px;padding:25px 0}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getDatabase,ref,set,get,push,onValue,update,runTransaction} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

/* =========================
   1) Firebase 설정
   Firebase Console > 프로젝트 설정 > 내 앱에서 값 입력
   ========================= */
const firebaseConfig = {
  apiKey: "AIzaSyBplncyBKA7gcUo_F9XTeMeXUDkmSuME8k",
  authDomain: "case-07.firebaseapp.com",
  projectId: "case-07",
  storageBucket: "case-07.firebasestorage.app",
  messagingSenderId: "928531533523",
  appId: "1:928531533523:web:3206c9fcada577db46ce26",
  measurementId: "G-QWDG3DJFSC",databaseURL: "https://case-07-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const evidence = {
 A:[
  ["a01","현장 사진 #01 — 서재 전체","서재 책상, 쓰러진 의자, 회중시계가 놓인 위치를 확인할 수 있다."],
  ["a02","현장 사진 #02 — 회중시계","시계의 뒷면 가장자리에서 미세한 긁힘이 확인된다."],
  ["a03","독성검사 보고서","회중시계 표면에서 미량의 독성 물질 반응. 정확한 투입 시각은 특정 불가."],
  ["a04","서재 잠금장치 감식","23:27에 잠금장치가 한 차례 해제된 기록과 물리적 흔적이 일치한다."]
 ],
 B:[
  ["b01","서하린 진술서","23:41까지 복도에 있었으며 서재 안으로 들어가지 않았다고 진술."],
  ["b02","강민재 진술서","22:50 이후 손님용 거실에 있었다고 주장."],
  ["b03","오세진 방문기록","22:40 시계 수리를 위해 저택에 입장. 22:56 현관 CCTV에 퇴장 모습."],
  ["b04","통화·문자 내역","23:26 짧은 발신 기록. 수신자는 저장되지 않은 번호."]
 ],
 C:[
  ["c01","현관 CCTV 스틸","22:56 오세진이 현관을 빠져나가는 장면."],
  ["c02","정전·전력 로그","23:20:13 정전, 23:21:00 복구. 서재 센서가 재부팅됨."],
  ["c03","벽시계·회중시계 오차표","벽시계는 실제보다 14분 빠르고, 피해자의 회중시계는 7분 느리다."],
  ["c04","저택 평면도","서재, 현관, 손님용 거실, 주방, 후문 동선이 표시되어 있다."]
 ]};
const sharedCatalog={...Object.fromEntries(evidence.A),...Object.fromEntries(evidence.B),...Object.fromEntries(evidence.C)};
const roles={
 A:{name:"탐정 A · 현장감식",desc:"현장 사진, 물증, 잠금장치, 독성검사"},
 B:{name:"탐정 B · 인물수사",desc:"진술, 문자, 통화, 방문기록"},
 C:{name:"탐정 C · 디지털수사",desc:"CCTV, 전력 로그, 시계 오차, 평면도"}
};

let app,auth,db,uid=null,roomCode="",role="",playerName="",room=null,tab="home",unsubs=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function code(){return Math.random().toString(36).slice(2,7).toUpperCase()}
function clearSubs(){unsubs.forEach(f=>f&&f());unsubs=[]}
function roomRef(){return ref(db,"rooms/"+roomCode)}
function render(){ if(!uid){$("#app").innerHTML='<div class="wrap"><div class="card">연결 중…</div></div>';return}
 if(!room){renderLobby();return} renderGame(); }
function renderLobby(){
 $("#app").innerHTML=`<div class="wrap"><div class="hero"><div class="eyebrow">CASE 07 · ONLINE CO-OP</div><div class="title">검은 시계의 밤</div><div class="sub">3명이 각자 자신의 휴대폰에서 접속해 서로 다른 증거를 모으는 협동 추리.</div></div>
 <div class="card"><h2>방 만들기</h2><input id="newName" placeholder="탐정 이름"><button class="primary" id="create">새 사건방 만들기</button></div>
 <div class="card"><h2>방 참가</h2><input id="joinCode" placeholder="방 코드 5자리" maxlength="5"><input id="joinName" placeholder="탐정 이름"><button class="primary" id="join">사건방 참가</button></div>
 <div class="card"><div class="notice">각 역할의 비공개 증거는 서버 권한으로 분리됩니다. 다른 역할을 선택한 플레이어에게 개인 증거 원문이 내려가지 않습니다.</div></div>
 <div class="footer">Firebase 연결 후 실제 3대 기기에서 사용할 수 있습니다.</div></div>`;
 $("#create").onclick=createRoom;$("#join").onclick=joinRoom;
}
async function createRoom(){
 playerName=$("#newName").value.trim()||"탐정"; roomCode=code();
 const base={createdAt:Date.now(),state:"lobby",players:{},shared:{},chat:{},notes:{}};
 await set(roomRef(),base); await claimRole("A",playerName); listenRoom();
}
async function joinRoom(){
 roomCode=$("#joinCode").value.trim().toUpperCase(); playerName=$("#joinName").value.trim()||"탐정";
 if(roomCode.length!==5)return alert("5자리 방 코드를 입력하세요.");
 const s=await get(roomRef()); if(!s.exists())return alert("존재하지 않는 방입니다.");
 renderRolePicker();
}
function renderRolePicker(){
 $("#app").innerHTML=`<div class="wrap"><div class="hero"><div class="eyebrow">ROLE SELECTION · ${esc(roomCode)}</div><div class="title">탐정 역할 선택</div><div class="sub">역할은 한 명만 선택할 수 있습니다.</div></div>
 <div class="grid">${Object.entries(roles).map(([k,v])=>`<div class="role"><span class="pill">DETECTIVE ${k}</span><h3>${esc(v.name)}</h3><p>${esc(v.desc)}</p><button data-role="${k}">이 역할로 참가</button></div>`).join("")}</div></div>`;
 document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>claimRole(b.dataset.role,playerName));
}
async function claimRole(r,n){
 const rr=roomRef(); let ok=false;
 await runTransaction(ref(db,"rooms/"+roomCode+"/players/"+r),cur=>{
   if(cur && cur.uid && cur.uid!==uid)return cur;
   ok=true; return {uid,name:n,joinedAt:Date.now(),ready:false};
 });
 if(!ok)return alert("이미 다른 플레이어가 선택한 역할입니다.");
 role=r; localStorage.setItem("case07",JSON.stringify({roomCode,role,name:n}));
 await set(ref(db,`rooms/${roomCode}/private/${r}/${uid}`),{role:r,uid,name:n,joinedAt:Date.now()});
 listenRoom();
}
function listenRoom(){
 clearSubs();
 unsubs.push(onValue(roomRef(),s=>{room=s.val();render()}));
}
function renderGame(){
 const ps=room.players||{}, shared=room.shared||{};
 $("#app").innerHTML=`<div class="wrap">
 <div class="top"><div><div class="eyebrow">CASE 07 · ${esc(roomCode)}</div><h1>검은 시계의 밤</h1></div><div><span class="pill">${esc(roles[role]?.name||role)}</span></div></div>
 <div class="card"><div class="top"><div><b>방 ${esc(roomCode)}</b><div class="status">3명이 각자 다른 화면에서 접속합니다.</div></div><div class="status">${["A","B","C"].map(k=>(ps[k]?`● ${k} ${esc(ps[k].name)}`:`○ ${k} 대기`)).join("　")}</div></div></div>
 <div class="tabs">${[["home","사건"],["private","내 증거"],["shared","공용 사건판"],["chat","탐정 채널"],["notes","추리노트"],["final","최종 추리"]].map(x=>`<button class="${tab===x[0]?'active':''}" data-tab="${x[0]}">${x[1]}</button>`).join("")}</div>
 <div id="content"></div></div>`;
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderGame()});
 const c=$("#content");
 if(tab==="home")home(c); if(tab==="private")privateView(c); if(tab==="shared")sharedView(c); if(tab==="chat")chatView(c); if(tab==="notes")notesView(c); if(tab==="final")finalView(c);
}
function home(c){
 const ready=Object.values(room.players||{}).filter(Boolean).length===3;
 c.innerHTML=`<div class="card"><h2>사건 브리핑</h2><p>23:58, 저택 서재에서 피해자가 숨진 채 발견됐다. 문은 잠겨 있었고, 정전 직후 기록에는 이상한 공백이 남아 있다.</p><div class="notice">핵심 규칙: <b>내 증거</b>는 나에게만 보입니다. 팀에게 알려주려면 해당 증거에서 <b>팀에게 공유</b>를 눌러야 합니다.</div></div>
 <div class="card"><h2>탐정 현황</h2>${["A","B","C"].map(k=>`<div class="evidence"><div><b>${esc(roles[k].name)}</b><small>${room.players?.[k]?` ${esc(room.players[k].name)} 접속`:" 대기 중"}</small></div><span>${room.players?.[k]?"●":"○"}</span></div>`).join("")}</div>
 <div class="card"><h2>공용 타임라인</h2><div class="evidence"><div><b>22:40</b><small>오세진 시계 수리</small></div></div><div class="evidence"><div><b>22:56</b><small>현관 CCTV 퇴장</small></div></div><div class="evidence"><div><b>23:20:13</b><small>정전</small></div></div><div class="evidence"><div><b>23:27</b><small>서재 잠금장치 해제 기록</small></div></div><div class="evidence"><div><b>23:58</b><small>시신 발견</small></div></div></div>`;
}
function privateView(c){
 const list=evidence[role]||[];
 c.innerHTML=`<div class="card"><h2>🔒 ${esc(roles[role].name)} 개인 사건파일</h2><p class="status">이 목록은 현재 기기에 선택된 역할의 정보만 표시합니다.</p>${list.map(([id,t,d])=>`<div class="evidence"><div><b>${esc(t)}</b><small>${esc(d)}</small></div><button class="share" data-share="${id}">팀에게 공유</button></div>`).join("")}</div>`;
 document.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>shareEvidence(b.dataset.share));
}
async function shareEvidence(id){
 const item=sharedCatalog[id]; if(!item)return;
 await update(ref(db,`rooms/${roomCode}/shared/${id}`),{id,title:item[0],text:item[1],from:role,fromName:room.players?.[role]?.name||playerName,sharedAt:Date.now()});
 alert("공용 사건판에 공유했습니다.");
}
function sharedView(c){
 const arr=Object.values(room.shared||{}).sort((a,b)=>a.sharedAt-b.sharedAt);
 c.innerHTML=`<div class="card"><h2>📌 공용 사건판</h2><p class="status">누군가 팀에 공유한 증거만 표시됩니다.</p>${arr.length?arr.map(x=>`<div class="evidence"><div><b>${esc(x.title)}</b><small>${esc(x.text)} · ${esc(x.fromName)}가 공유</small></div><span class="pill">SHARED</span></div>`).join(""):'<div class="notice">아직 공유된 증거가 없습니다.</div>'}</div>`;
}
function chatView(c){
 c.innerHTML=`<div class="card"><h2>💬 탐정 채널</h2><div id="chat" class="chat"></div><div class="row"><input id="chatInput" placeholder="팀에게 메시지…"><button class="primary" id="send">전송</button></div></div>`;
 const chat=room.chat||{}; $("#chat").innerHTML=Object.values(chat).sort((a,b)=>a.at-b.at).map(m=>`<div class="msg"><b>${esc(m.name)}</b> ${esc(m.text)}</div>`).join("");
 $("#send").onclick=async()=>{let t=$("#chatInput").value.trim();if(!t)return;await push(ref(db,`rooms/${roomCode}/chat`),{name:playerName,role,text:t,at:Date.now()});$("#chatInput").value=""};
}
function notesView(c){
 const n=room.notes?.[uid]||"";
 c.innerHTML=`<div class="card"><h2>📝 내 추리노트</h2><textarea id="note">${esc(n)}</textarea><button class="primary" id="saveNote">저장</button></div>`;
 $("#saveNote").onclick=async()=>{await set(ref(db,`rooms/${roomCode}/notes/${uid}`),$("#note").value);alert("저장했습니다.")};
}
function finalView(c){
 c.innerHTML=`<div class="card"><h2>⚖️ 최종 추리</h2><p>세 명 모두 제출하면 정답을 공개합니다.</p>
 <label>범인</label><select id="culprit"><option>오세진</option><option>서하린</option><option>강민재</option><option>문예린</option></select>
 <label>수법</label><input id="method" placeholder="어떻게 살해했는가">
 <label>결정적 시각</label><input id="time" placeholder="예: 23:27">
 <label>동기</label><input id="motive" placeholder="왜 범행했는가">
 <button class="primary" id="submitFinal">최종 추리 제출</button></div>
 <div class="card"><h3>제출 현황</h3>${["A","B","C"].map(k=>`<div class="evidence"><b>${roles[k].name}</b><span>${room.finals?.[k]?"제출 완료":"미제출"}</span></div>`).join("")}</div>
 ${Object.keys(room.finals||{}).length===3?`<div class="card"><div class="notice ok"><b>사건 해결:</b> 정답은 오세진 / 회중시계에 독성 물질 설치 / 23:27 / 위조품 거래 증거 인멸입니다.</div></div>`:""}`;
 $("#submitFinal").onclick=async()=>{await set(ref(db,`rooms/${roomCode}/finals/${role}`),{culprit:$("#culprit").value,method:$("#method").value,time:$("#time").value,motive:$("#motive").value,at:Date.now()});alert("최종 추리를 제출했습니다.")};
}
async function boot(){
 try{
   app=initializeApp(firebaseConfig);auth=getAuth(app);db=getDatabase(app);
   onAuthStateChanged(auth,u=>{uid=u?.uid||null;render()});
   await signInAnonymously(auth);
 }catch(e){
   $("#app").innerHTML=`<div class="wrap"><div class="card"><h2>Firebase 설정이 필요합니다</h2><p>이 파일은 실제 3대 휴대폰용 온라인 버전입니다. 코드 상단의 <b>firebaseConfig</b>를 본인의 Firebase 웹 앱 설정값으로 교체한 뒤 Hosting에 배포하세요.</p><pre style="white-space:pre-wrap;color:#f2c9c9">${esc(e.message)}</pre></div></div>`;
 }
}
boot();
</script>
</body></html>
