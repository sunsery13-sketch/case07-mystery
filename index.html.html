<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CASE 08 — 유리온실의 23분</title>
<style>
:root{--bg:#090c11;--panel:#141922;--panel2:#1b222d;--line:#303a48;--text:#eef2f6;--muted:#9ba7b6;--accent:#d8a24a;--danger:#cf6679;--ok:#69c18c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#202733 0,#090c11 58%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1080px;margin:auto;padding:18px}.hero{padding:24px 0 12px}.eyebrow{color:var(--accent);letter-spacing:.18em;font-size:12px}.title{font-family:Georgia,serif;font-size:clamp(34px,7vw,68px);margin:8px 0}.sub{color:var(--muted)}
.card{background:rgba(20,25,34,.94);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 12px 30px #0005}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.role{padding:18px;border:1px solid var(--line);border-radius:14px;background:#10151d}.role h3{margin:0 0 7px}.role p{color:var(--muted);min-height:58px}.role button,.primary{width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#17130b;font-weight:800}
input,textarea,select{width:100%;background:#0e131a;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;margin:6px 0 10px}textarea{min-height:110px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none!important}.pill{display:inline-block;border:1px solid var(--line);padding:5px 9px;border-radius:99px;color:var(--muted);font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.tabs{display:flex;gap:7px;overflow:auto;padding:8px 0}.tabs button{white-space:nowrap;background:#111720;color:#ccd4de;border:1px solid var(--line);border-radius:9px;padding:9px 12px}.tabs button.active{background:#2a3442;color:#fff}
.evidence{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:13px;margin:8px 0;background:#111720}.evidence small{display:block;color:var(--muted);margin-top:5px}.share{background:#273d31;color:#b8f0ca;border:1px solid #3c624b;border-radius:8px;padding:8px 10px;white-space:nowrap}.chat{max-height:360px;overflow:auto;background:#0c1117;border:1px solid var(--line);border-radius:12px;padding:10px}.msg{padding:8px 10px;border-bottom:1px solid #202732}.msg b{color:var(--accent)}.notice{padding:11px;border-left:3px solid var(--accent);background:#17130d;color:#e9d6ad}.notice.danger{border-left-color:var(--danger)}.notice.ok{border-left-color:var(--ok)}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.pin{background:#171d26;border:1px solid #465264;border-radius:10px;padding:12px}.pin .from{color:var(--accent);font-size:12px;margin-bottom:6px}.status{font-size:13px;color:var(--muted)}.bigcode{font-size:30px;letter-spacing:.25em;font-weight:900;text-align:center;padding:16px;background:#0c1117;border-radius:12px}.footer{color:#697586;font-size:12px;padding:25px 0}.clueTag{font-size:11px;color:#aeb8c5;border:1px solid #394452;border-radius:99px;padding:3px 7px;margin-right:5px}.sectionTitle{margin-top:26px}.timeline{border-left:2px solid #3c4654;padding-left:15px}.timeline div{margin:12px 0}.timeline b{color:var(--accent)}.quote{font-style:italic;color:#d7dde5;background:#0e131a;border-radius:10px;padding:11px}.mini{font-size:12px;color:var(--muted)}
</style>
</head>
<body><div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getDatabase,ref,set,get,push,onValue,update,runTransaction} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

/* =========================
   Firebase 설정
   기존 GitHub 파일의 firebaseConfig 값을 그대로 넣어주세요.
   ========================= */
const firebaseConfig = {
  apiKey: "AIzaSyBplncyBKA7gcUo_F9XTeMeXUDkmSuME8k",
  authDomain: "case-07.firebaseapp.com",
  databaseURL: "https://case-07-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "case-07",
  storageBucket: "case-07.firebasestorage.app",
  messagingSenderId: "928531533523",
  appId: "1:928531533523:web:3206c9fcada577db46ce26",
  measurementId: "G-QWDG3DJFSC"
};

const roles={
 A:{name:"탐정 A · 현장감식",desc:"현장 사진, 부검·독성, 물증, 잠금장치"},
 B:{name:"탐정 B · 인물수사",desc:"용의자 진술, 문자, 통화, 출입·방문 기록"},
 C:{name:"탐정 C · 디지털수사",desc:"CCTV, 전력 로그, 스마트홈 기록, 시계 오차"}
};

/* CASE 08 — 유리온실의 23분
   서로 다른 단서가 연결되어야 풀리도록 구성한 사건.
*/
const evidence={
 A:[
  ["a01","현장사진 — 유리온실 동쪽 테이블","피해자 윤태준은 의자 옆 바닥에서 발견됐다. 테이블 위에는 반쯤 마신 차와 오래된 황동 열쇠가 있다."],
  ["a02","부검 예비보고서","사망 원인은 심장성 독성 반응. 독성 물질은 매우 적은 양으로 투여됐고, 섭취 후 증상이 나타나기까지 시간이 필요하다."],
  ["a03","차잔 감식","차에서는 치명량의 독성이 검출되지 않았다. 잔의 손잡이 안쪽에만 미량의 동일 물질이 묻어 있다."],
  ["a04","회중시계 물증","피해자의 회중시계 유리 안쪽에 작은 균열. 초침은 23:34에서 멈춰 있지만 시계 자체가 실제보다 11분 느리다는 정비 기록이 붙어 있다."],
  ["a05","문 잠금장치 감식","온실 문은 자동잠금 방식. 내부 손잡이에는 피해자의 지문이 있으나, 외부 비상키홀 주변에 최근 사용 흔적이 있다."],
  ["a06","찻숟가락 미세물질","숟가락 홈에서 투명한 수지 조각이 발견됐다. 일반 플라스틱과 달리 열에 녹은 뒤 굳은 흔적이다."]
 ],
 B:[
  ["b01","윤태준의 비서 한서윤 진술","23:10경 피해자가 '누군가 내 계약서를 바꿔치기했다'고 말하는 것을 들었다. 23:20에는 온실에 아무도 없었다고 주장한다."],
  ["b02","김도현 진술","22:50부터 음악실에서 피아노를 연습했다고 주장. 23:30에야 소란을 듣고 나왔다고 진술한다."],
  ["b03","오세진 진술","22:56에 저택을 떠났다고 주장하며, 그 뒤에는 다시 들어오지 않았다고 한다."],
  ["b04","민아린 진술","23:15에 주방에서 차를 준비했고, 피해자에게 직접 가져다주지는 않았다고 주장한다."],
  ["b05","삭제 복구 문자","23:18 발신: '열쇠는 그대로 두세요. 계약서만 바꾸면 됩니다.' 수신자는 한서윤의 번호가 아니며, 발신자는 특정되지 않았다."],
  ["b06","방문기록 사본","22:40 오세진 입장. 22:56 현관 퇴장. 23:07 후문 센서가 한 차례 열렸다가 14초 뒤 닫혔다."],
  ["b07","계약서 초안","피해자는 다음 날 오전, 위조 계약서의 진위를 공개할 예정이었다. 수정본에는 특정 용의자에게 불리한 조항이 추가돼 있다."]
 ],
 C:[
  ["c01","현관 CCTV","22:56 오세진이 현관으로 나가는 모습. 화면 우측 유리문에는 사람 그림자가 하나 더 비치지만 얼굴은 식별되지 않는다."],
  ["c02","후문 CCTV","23:06:48 후문 접근. 23:07:02 문 열림. 23:07:16 문 닫힘. 인물은 우산을 쓰고 있어 얼굴 식별 불가."],
  ["c03","온실 카메라 장애 로그","23:11:02~23:14:41 영상 저장 실패. 시스템 재부팅 없이 특정 카메라 한 대만 기록이 끊겼다."],
  ["c04","스마트홈 전력 로그","23:19:12 온실 조명 밝기 100%→20%. 23:21:04 다시 100%. 전원 자체의 정전은 없었다."],
  ["c05","온실 자동문 로그","23:07:03 외부 개방, 23:07:17 폐쇄. 23:27:51 내부 개방, 23:28:06 폐쇄. 23:41:22 경찰 도착 후 개방."],
  ["c06","벽시계 보정 기록","온실 벽시계는 실제보다 12분 빠르다. 마지막 보정은 사건 3일 전."],
  ["c07","피해자 휴대폰 동기화 기록","23:24:09 메모 앱 수정. 내용은 '계약서 원본은 온실 화분 아래'였으나 23:29에 삭제됐다."]
 ]
};

/* 중요: 기존 코드의 공용 공유 버그 수정.
   Object.fromEntries(evidence.A)는 [id,title,desc]를 잘못 처리하므로
   여기서는 각 배열을 객체로 명시적으로 변환한다.
*/
const catalog={};
Object.values(evidence).flat().forEach(([id,title,text])=>catalog[id]={id,title,text});

const solution={
 culprit:"김도현",
 method:"독성 물질을 묻힌 숟가락/차 도구를 이용해 차를 마시는 과정에서 소량이 섭취되도록 했다.",
 realTime:"23:27 전후",
 motive:"위조 계약서가 공개되는 것을 막고 자신에게 불리한 계약 조작 사실을 은폐하려 했다.",
 alibi:"음악실에 계속 있었다는 주장은 디지털 기록과 현장 단서가 맞지 않는다."
};

let app,auth,db,uid=null,roomCode="",role="",playerName="",room=null,tab="home",unsubs=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const makeCode=()=>Math.random().toString(36).slice(2,7).toUpperCase();
const clearSubs=()=>{unsubs.forEach(f=>f&&f());unsubs=[]};
const roomRef=()=>ref(db,"rooms/"+roomCode);

function render(){
 if(!uid){$("#app").innerHTML='<div class="wrap"><div class="card">Firebase 연결 중…</div></div>';return}
 if(!room){renderLobby();return}
 renderGame();
}

function renderLobby(){
 $("#app").innerHTML=`<div class="wrap">
 <div class="hero"><div class="eyebrow">CASE 08 · ONLINE CO-OP</div><div class="title">유리온실의 23분</div><div class="sub">3명의 탐정이 서로 다른 증거를 모아 하나의 사건을 재구성합니다.</div></div>
 <div class="card"><h2>방 만들기</h2><input id="newName" placeholder="탐정 이름"><button class="primary" id="create">새 사건방 만들기</button></div>
 <div class="card"><h2>방 참가</h2><input id="joinCode" placeholder="방 코드 5자리" maxlength="5"><input id="joinName" placeholder="탐정 이름"><button class="primary" id="join">사건방 참가</button></div>
 <div class="card"><div class="notice">이번 사건은 용의자들의 진술, CCTV 시간, 시계 오차, 물증을 서로 대조해야 풀 수 있습니다.</div></div>
 </div>`;
 $("#create").onclick=createRoom;$("#join").onclick=joinRoom;
}

async function createRoom(){
 playerName=$("#newName").value.trim()||"탐정";
 roomCode=makeCode();
 await set(roomRef(),{createdAt:Date.now(),caseId:"CASE08",state:"lobby",players:{},shared:{},chat:{},notes:{},finals:{}});
 renderRolePicker();
}

async function joinRoom(){
 roomCode=$("#joinCode").value.trim().toUpperCase();
 playerName=$("#joinName").value.trim()||"탐정";
 if(roomCode.length!==5)return alert("5자리 방 코드를 입력하세요.");
 const s=await get(roomRef());
 if(!s.exists())return alert("존재하지 않는 방입니다.");
 renderRolePicker();
}

function renderRolePicker(){
 $("#app").innerHTML=`<div class="wrap">
 <div class="hero"><div class="eyebrow">ROLE SELECTION · ${esc(roomCode)}</div><div class="title">탐정 역할 선택</div><div class="sub">한 역할은 한 명만 선택할 수 있습니다.</div></div>
 <div class="grid">${Object.entries(roles).map(([k,v])=>`<div class="role"><span class="pill">DETECTIVE ${k}</span><h3>${esc(v.name)}</h3><p>${esc(v.desc)}</p><button data-role="${k}">이 역할로 참가</button></div>`).join("")}</div>
 </div>`;
 document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>claimRole(b.dataset.role,playerName));
}

async function claimRole(r,n){
 const slot=ref(db,`rooms/${roomCode}/players/${r}`);
 let ok=false;
 await runTransaction(slot,cur=>{
   if(cur && cur.uid && cur.uid!==uid)return cur;
   ok=true;
   return {uid,name:n,joinedAt:Date.now()};
 });
 if(!ok)return alert("이미 다른 플레이어가 선택한 역할입니다.");
 role=r; playerName=n;
 localStorage.setItem("case08",JSON.stringify({roomCode,role,name:n}));
 listenRoom();
}

function listenRoom(){
 clearSubs();
 unsubs.push(onValue(roomRef(),s=>{room=s.val();render()}));
}

function renderGame(){
 const ps=room.players||{};
 $("#app").innerHTML=`<div class="wrap">
 <div class="top"><div><div class="eyebrow">CASE 08 · ${esc(roomCode)}</div><h1>유리온실의 23분</h1></div><span class="pill">${esc(roles[role]?.name||role)}</span></div>
 <div class="card"><div class="top"><div><b>방 ${esc(roomCode)}</b><div class="status">실시간 협동 사건방</div></div><div class="status">${["A","B","C"].map(k=>ps[k]?`● ${k} ${esc(ps[k].name)}`:`○ ${k} 대기`).join("　")}</div></div></div>
 <div class="tabs">${[["home","사건"],["private","내 증거"],["shared","공용 사건판"],["chat","탐정 채널"],["notes","추리노트"],["final","최종 추리"]].map(x=>`<button class="${tab===x[0]?'active':''}" data-tab="${x[0]}">${x[1]}</button>`).join("")}</div>
 <div id="content"></div></div>`;
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderGame()});
 const c=$("#content");
 if(tab==="home")home(c);
 if(tab==="private")privateView(c);
 if(tab==="shared")sharedView(c);
 if(tab==="chat")chatView(c);
 if(tab==="notes")notesView(c);
 if(tab==="final")finalView(c);
}

function home(c){
 c.innerHTML=`<div class="card"><h2>사건 브리핑</h2>
 <p>23:52, 저택의 유리온실에서 유명 골동품 거래상 <b>윤태준</b>이 쓰러진 채 발견됐다. 사망 직전 그는 다음 날 공개할 계약서 원본을 숨겼다는 메모를 남겼다.</p>
 <div class="notice">이 사건의 핵심은 <b>23:07~23:28</b> 사이의 움직임과 서로 다른 시계의 오차입니다. 한 사람의 진술만 믿지 마세요.</div>
 </div>
 <div class="card"><h2>용의자</h2>
 <div class="evidence"><div><b>김도현</b><small>피해자의 사업 파트너. 계약 조작 의혹을 부인.</small></div><span class="clueTag">사업</span></div>
 <div class="evidence"><div><b>한서윤</b><small>피해자의 비서. 계약서 관리 권한을 갖고 있었다.</small></div><span class="clueTag">비서</span></div>
 <div class="evidence"><div><b>오세진</b><small>골동품 시계 수리공. 22:56 퇴장 기록이 있다.</small></div><span class="clueTag">외부인</span></div>
 <div class="evidence"><div><b>민아린</b><small>주방 담당. 23:15경 차를 준비했다고 진술.</small></div><span class="clueTag">주방</span></div>
 </div>
 <div class="card"><h2>공용 타임라인의 출발점</h2><div class="timeline">
 <div><b>22:40</b> 오세진 저택 입장</div>
 <div><b>22:56</b> 오세진 현관 CCTV 퇴장</div>
 <div><b>23:07</b> 후문 센서 작동</div>
 <div><b>23:11~23:14</b> 온실 카메라 기록 공백</div>
 <div><b>23:19</b> 온실 조명 밝기 변화</div>
 <div><b>23:27 전후</b> 피해자에게 결정적인 사건 발생 가능성</div>
 <div><b>23:52</b> 발견</div>
 </div></div>`;
}

function privateView(c){
 const list=evidence[role]||[];
 c.innerHTML=`<div class="card"><h2>🔒 ${esc(roles[role].name)} 개인 사건파일</h2>
 <p class="status">여기에만 네 역할의 증거가 표시됩니다. 팀에 알려줄 증거는 반드시 공유 버튼을 눌러주세요.</p>
 ${list.map(([id,t,d])=>`<div class="evidence"><div><b>${esc(t)}</b><small>${esc(d)}</small><div class="mini">${id}</div></div><button class="share" data-share="${id}">팀에게 공유</button></div>`).join("")}</div>`;
 document.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>shareEvidence(b.dataset.share));
}

async function shareEvidence(id){
 const item=catalog[id];
 if(!item)return alert("증거를 찾지 못했습니다.");
 const data={id:item.id,title:item.title,text:item.text,from:role,fromName:room.players?.[role]?.name||playerName,sharedAt:Date.now()};
 /* 핵심 수정: title/text가 정확히 저장되고, push로 고유 키를 만들어 여러 사람이 공유해도 모두 남는다. */
 await push(ref(db,`rooms/${roomCode}/shared`),data);
 alert("공용 사건판에 공유했습니다.");
 tab="shared"; renderGame();
}

function sharedView(c){
 const arr=Object.values(room.shared||{}).sort((a,b)=>(a.sharedAt||0)-(b.sharedAt||0));
 c.innerHTML=`<div class="card"><h2>📌 공용 사건판</h2>
 <p class="status">팀원이 공유한 모든 증거가 실시간으로 쌓입니다. 새로고침해도 사라지지 않습니다.</p>
 ${arr.length?`<div class="board">${arr.map(x=>`<div class="pin"><div class="from">탐정 ${esc(x.from||"?")} · ${esc(x.fromName||"탐정")}가 공유</div><b>${esc(x.title)}</b><p>${esc(x.text)}</p><span class="pill">${esc(x.id||"SHARED")}</span></div>`).join("")}</div>`:'<div class="notice">아직 공유된 증거가 없습니다. 개인 사건파일에서 증거를 공유해보세요.</div>'}
 </div>`;
}

function chatView(c){
 const chat=room.chat||{};
 c.innerHTML=`<div class="card"><h2>💬 탐정 채널</h2><div id="chat" class="chat">${Object.values(chat).sort((a,b)=>a.at-b.at).map(m=>`<div class="msg"><b>${esc(m.name)}</b> <span class="mini">(${esc(m.role)})</span> ${esc(m.text)}</div>`).join("")}</div>
 <div class="row"><input id="chatInput" placeholder="팀에게 메시지…"><button class="primary" id="send">전송</button></div></div>`;
 $("#send").onclick=async()=>{const t=$("#chatInput").value.trim();if(!t)return;await push(ref(db,`rooms/${roomCode}/chat`),{name:playerName,role,text:t,at:Date.now()});$("#chatInput").value=""};
}

function notesView(c){
 const n=room.notes?.[uid]||"";
 c.innerHTML=`<div class="card"><h2>📝 내 추리노트</h2><p class="status">이 노트는 네 계정에만 연결됩니다.</p><textarea id="note">${esc(n)}</textarea><button class="primary" id="saveNote">저장</button></div>`;
 $("#saveNote").onclick=async()=>{await set(ref(db,`rooms/${roomCode}/notes/${uid}`),$("#note").value);alert("저장했습니다.")};
}

function finalView(c){
 const finals=room.finals||{};
 c.innerHTML=`<div class="card"><h2>⚖️ 최종 추리</h2>
 <p>세 명이 각각 제출하면 정답 공개 단계로 넘어갑니다.</p>
 <label>범인</label><select id="culprit"><option>김도현</option><option>한서윤</option><option>오세진</option><option>민아린</option></select>
 <label>수법</label><textarea id="method" placeholder="독성 물질이 어떻게 피해자에게 들어갔는지"></textarea>
 <label>실제 결정적 시각</label><input id="time" placeholder="예: 23:27 전후">
 <label>동기</label><textarea id="motive" placeholder="왜 범행했는지"></textarea>
 <button class="primary" id="submitFinal">최종 추리 제출</button></div>
 <div class="card"><h3>제출 현황</h3>${["A","B","C"].map(k=>`<div class="evidence"><b>${roles[k].name}</b><span>${finals[k]?"제출 완료":"미제출"}</span></div>`).join("")}</div>
 ${Object.keys(finals).length===3?`<div class="card"><div class="notice ok"><h3>사건 해설</h3>
 <p><b>범인:</b> ${solution.culprit}</p><p><b>수법:</b> ${solution.method}</p><p><b>실제 시각:</b> ${solution.realTime}</p><p><b>동기:</b> ${solution.motive}</p><p><b>알리바이의 허점:</b> ${solution.alibi}</p>
 </div></div>`:""}`;
 $("#submitFinal").onclick=async()=>{
   await set(ref(db,`rooms/${roomCode}/finals/${role}`),{culprit:$("#culprit").value,method:$("#method").value,time:$("#time").value,motive:$("#motive").value,at:Date.now()});
   alert("최종 추리를 제출했습니다.");
 };
}

async function boot(){
 try{
   app=initializeApp(firebaseConfig);
   auth=getAuth(app);
   db=getDatabase(app);
   onAuthStateChanged(auth,u=>{uid=u?.uid||null;render()});
   await signInAnonymously(auth);
 }catch(e){
   $("#app").innerHTML=`<div class="wrap"><div class="card"><h2>Firebase 설정을 확인해주세요</h2><p>상단의 firebaseConfig에 현재 Firebase 웹 앱 설정값을 넣어야 합니다.</p><pre style="white-space:pre-wrap;color:#f2c9c9">${esc(e.message)}</pre></div></div>`;
 }
}
boot();
</script></body></html>
