<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASE 01 — 마지막 공연</title>
<style>
:root{--bg:#090b10;--p:#141923;--p2:#1a202c;--l:#303848;--t:#eef2f7;--m:#98a3b4;--a:#79aaff;--b:#d29cff;--c:#62d8bd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#20293a,#090b10 50%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}#app{max-width:760px;margin:auto;padding:16px 14px 42px}.top{display:flex;justify-content:space-between;color:#aeb8c8;font-size:12px;letter-spacing:.08em}.hero{padding:35px 4px 25px}.ey{font-size:11px;letter-spacing:.18em;color:#9da9bb}.hero h1{font-size:35px;margin:8px 0}.hero p,.muted{color:var(--m);line-height:1.7}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--l);border-radius:18px;padding:18px;margin:11px 0}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.role{background:#0e1219;border:1px solid var(--l);color:var(--t);border-radius:14px;text-align:left;padding:15px;min-height:145px}.role b{font-size:20px}.role strong{display:block;margin:9px 0 5px}.role span{font-size:12px;color:var(--m);line-height:1.5}.role.sel{outline:2px solid currentColor}.ra{color:var(--a)}.rb{color:var(--b)}.rc{color:var(--c)}button{font:inherit;cursor:pointer}.primary{width:100%;padding:14px;border:0;border-radius:12px;margin-top:12px;background:#e9edf4;color:#10131a;font-weight:800}.primary:disabled{opacity:.4}.ghost,.tab{border:1px solid var(--l);background:#10151e;color:var(--t);border-radius:11px;padding:10px 12px}.tabs{display:flex;gap:7px;margin-top:14px;overflow:auto}.tab{white-space:nowrap;color:#a5afbf}.tab.on{background:#293140;color:#fff}.bar{height:5px;background:#232a37;border-radius:9px;margin-top:10px}.bar i{display:block;height:100%;background:#bac7da;border-radius:9px}.evi{margin:10px 0;padding:13px;border-left:3px solid #718097;background:#0d1219;border-radius:0 12px 12px 0}.evi h4{margin:5px 0}.evi p{font-size:13px;color:#b7c0cd;line-height:1.6;margin:0}.tag{font-size:11px;color:#8e99aa}.notice{padding:12px;border:1px dashed #414b5d;border-radius:12px;color:#aeb7c5;font-size:13px;line-height:1.6}.choice{display:block;width:100%;text-align:left;padding:12px;margin:6px 0;border:1px solid var(--l);background:#0e131b;color:#dfe5ee;border-radius:11px}.choice.on{background:#252d3b;border-color:#9ba8bb}.lock{opacity:.55}@media(max-width:560px){.roles{grid-template-columns:1fr}.role{min-height:0}.hero h1{font-size:30px}}
</style></head><body><div id="app"></div>
<script>
const R={A:{n:"현장 수사관",c:"ra",d:"시신·무대·소품·물리적 흔적을 조사합니다."},B:{n:"인물 수사관",c:"rb",d:"용의자·관계·진술의 빈틈을 조사합니다."},C:{n:"디지털 수사관",c:"rc",d:"CCTV·출입·조명·시간 기록을 복원합니다."}};
const D={
A:[["a1","무대 중앙의 긁힘","시신 주변 바닥에 공연용 분필 자국과 다른 짧은 긁힘이 두 군데 남아 있다."],["a2","소매의 섬유","진우의 소매에서 검은 무대 커튼과 질감이 다른 섬유가 발견된다."],["a3","소품 상자","소품 상자 하나의 봉인 테이프가 다시 붙여진 흔적이 있다."],["a4","무대 안전표시","무대 끝 안전표시가 원래 위치보다 조금 안쪽으로 밀려 있다."],["a5","복도의 얼룩","분장실 복도에 최근 닦아낸 듯한 흔적이 있다."],["a6","소품 목록","실제 상자 속 내용과 공연용 소품 목록이 하나 어긋난다."]],
B:[["b1","강유진의 진술","유진은 공연 직전 진우와 다퉜지만 마지막 장면이 시작된 뒤 직접 대화하지 않았다고 말한다."],["b2","박태준의 진술","태준은 공연 준비 중 무대를 점검했고 마지막 장면에는 객석 뒤에서 대기했다고 말한다."],["b3","오하린의 진술","하린은 진우의 의상을 확인했지만 공연 직전 의상실을 떠났다고 말한다."],["b4","이도윤의 진술","도윤은 공연 중 조명 시스템을 한 번 재시작했고 그 때문에 일부 로그가 사라졌다고 말한다."],["b5","최현우의 진술","현우는 계약 문제로 진우와 다퉜지만 공연 시작 후 제작진 사무실에 있었다고 말한다."],["b6","진우의 수첩","수첩에는 '공연 뒤 공개 / 계약 / 오래된 장부'라는 메모가 남아 있다."],["b7","직원 관계 조사","진우가 공연 다음 날 한 직원의 해고를 확정할 예정이었다는 사실이 확인된다."]],
C:[["c1","객석 CCTV","마지막 장면 직전 객석 뒤쪽에 있던 사람들의 이동이 기록되어 있다."],["c2","복도 CCTV","공연 중 복도 카메라가 약 18초간 화면을 잃는다."],["c3","조명 로그","마지막 장면의 조명 큐 외에 한 번의 수동 입력이 추가되어 있다."],["c4","무대 장치 로그","마지막 장면 직전 장치 점검 명령이 한 번 남아 있다."],["c5","출입 기록","제어실 출입 기록과 직원 진술을 대조하면 시간대가 하나 맞지 않는다."],["c6","삭제 로그 복구","22:41:12와 22:41:30 사이에 기록 공백이 있다."],["c7","공연 큐 시트","진우가 쓰러진 순간은 원래 대본의 마지막 동작과 정확히 겹친다."]]
};
const L={a1:["c7"],a2:["b3"],a3:["c4"],a4:["c4"],a5:["c2"],a6:["b6"],b1:["c1"],b2:["c5"],b3:["a2"],b4:["c3","c6"],b5:["c5"],b6:["a6"],b7:["a5"],c1:["b1"],c2:["a5"],c3:["b4"],c4:["a3","a4"],c5:["b2","b5"],c6:["b4"],c7:["a1"]};
let S={role:null,found:{A:[],B:[],C:[]},shared:[],tab:"invest",final:{}};
try{Object.assign(S,JSON.parse(localStorage.case01||"{}"))}catch(e){}
function save(){try{localStorage.case01=JSON.stringify(S)}catch(e){}}
function ev(id){for(const r in D){let x=D[r].find(z=>z[0]==id);if(x)return{id,title:x[1],text:x[2],role:r}}}
function open(id){let need=L[id]||[];return need.every(x=>S.found[S.role].includes(x)||S.shared.some(y=>y.id==x))}
function head(){return `<div class="top"><b>CASE ROOM · 01</b><span>${S.role?"ROLE "+S.role:"3인 협동"}</span></div>`}
function home(){return head()+`<section class="hero"><div class="ey">COOPERATIVE MURDER MYSTERY</div><h1>마지막 공연</h1><p>한 사람은 현장을 보고, 한 사람은 사람을 읽고, 한 사람은 시간을 복원한다.<br>세 수사가 하나의 진실을 만든다.</p></section><div class="card"><h2>사건</h2><p class="muted">공연이 끝난 직후 극장 대표 서진우가 무대 중앙에서 쓰러졌다. 관객들은 연출이라고 생각했지만 그는 숨져 있었다.</p><div class="notice">서로의 단서를 자유롭게 말해 주세요. 이 게임은 정보 공유를 전제로 설계되었습니다.</div></div><div class="card"><h2>역할 선택</h2><div class="roles">${Object.entries(R).map(([k,r])=>`<button class="role ${r.c} ${S.role==k?"sel":""}" data-r="${k}"><b>${k}</b><strong>${r.n}</strong><span>${r.d}</span></button>`).join("")}</div><button id="go" class="primary" ${S.role?"":"disabled"}>수사실 입장</button></div>`}
function game(){let r=R[S.role];return head()+`<div class="card"><div class="ey ${r.c}">${S.role} · ${r.n}</div><h2>공동 수사실</h2><p class="muted">발견 ${Object.values(S.found).flat().length} · 공유 ${S.shared.length}</p><div class="bar"><i style="width:${Math.min(100,Object.values(S.found).flat().length/20*100)}%"></i></div><div class="tabs">${[["invest","내 조사"],["shared","공용 사건판"],["final","최종 추리"]].map(x=>`<button class="tab ${S.tab==x[0]?"on":""}" data-t="${x[0]}">${x[1]}</button>`).join("")}</div></div>${S.tab=="invest"?invest():S.tab=="shared"?shared():final()}`}
function invest(){let h=`<div class="card"><h3>${R[S.role].n}</h3><p class="muted">다른 역할의 조사 능력은 대신할 수 없습니다. 단서를 공유하면 서로의 후속 조사가 열립니다.</p></div>`;for(let x of D[S.role]){let f=S.found[S.role].includes(x[0]),o=open(x[0])||!L[x[0]];h+=`<div class="card ${!o&&!f?"lock":""}"><div class="tag">${x[0].toUpperCase()}</div><h3>${x[1]}</h3><p class="muted">${f?x[2]:o?"조사 가능한 항목입니다.":"다른 수사관의 단서가 필요합니다."}</p>${!f&&o?`<button class="ghost get" data-id="${x[0]}">조사하기</button>`:""}${f?`<button class="ghost sh" data-id="${x[0]}">공용 사건판에 공유</button>`:""}</div>`}return h}
function shared(){return `<div class="card"><h2>공용 사건판</h2><p class="muted">공유된 단서는 모두가 볼 수 있습니다.</p>${S.shared.length?S.shared.map(x=>`<div class="evi"><div class="tag">${x.role} · ${x.id.toUpperCase()}</div><h4>${x.title}</h4><p>${x.text}</p></div>`).join(""):`<div class="notice">아직 공유된 단서가 없습니다.</div>`}</div>`}
function final(){let names=["강유진","박태준","오하린","이도윤","최현우"],methods=["공연 중 우발적 사고","무대 장치의 의도적 조작","개인적인 원한에 의한 직접 범행","계약 문제를 숨기기 위한 범행"];return `<div class="card"><h2>최종 추리</h2><p class="muted">세 사람이 충분히 논의한 뒤 결론을 선택하세요. 틀려도 정답이나 범인은 자동 공개되지 않습니다.</p><h3>범인은?</h3>${names.map(n=>`<button class="choice ${S.final.c==n?"on":""}" data-f="c" data-v="${n}">${n}</button>`).join("")}<h3>핵심은?</h3>${methods.map(n=>`<button class="choice ${S.final.m==n?"on":""}" data-f="m" data-v="${n}">${n}</button>`).join("")}<button id="submit" class="primary" ${S.final.c&&S.final.m?"":"disabled"}>결론 제출</button>${S.final.done?`<div class="notice" style="margin-top:12px">결론이 기록되었습니다. 이 파일은 3인 협동 구조를 먼저 검증하는 프로토타입입니다.</div>`:""}</div>`}
function bind(){document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{S.role=b.dataset.r;save();render()});let g=document.getElementById("go");if(g)g.onclick=()=>{S.tab="invest";render()};document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();render()});document.querySelectorAll(".get").forEach(b=>b.onclick=()=>{let id=b.dataset.id;if(!S.found[S.role].includes(id))S.found[S.role].push(id);save();render()});document.querySelectorAll(".sh").forEach(b=>b.onclick=()=>{let x=ev(b.dataset.id);if(!S.shared.some(y=>y.id==x.id))S.shared.push(x);save();render()});document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.final[b.dataset.f]=b.dataset.v;save();render()});let sub=document.getElementById("submit");if(sub)sub.onclick=()=>{S.final.done=true;save();render()}}
function render(){app.innerHTML=S.role?game():home();bind()}render();
</script></body></html>
